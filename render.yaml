services:
  - type: web
    name: ledgerline-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: LedgerLine API
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://ledgerline-frontend.onrender.com
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: 30

  - type: web
    name: ledgerline-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_BASE_URL
        value: https://ledgerline-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html