
services:
  db:
    image: postgres:17
    container_name: ledgerline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"
    ports:
      - "5433:5432"
    volumes:
      - ledgerline_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ledgerline_user -d ledgerline
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerline_data:
