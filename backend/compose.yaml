
services:
  db:
    image: postgres:17
    container_name: ledgerline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in backend/.env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ledgerline_data:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ledgerline_user -d ledgerline
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerline_data:
